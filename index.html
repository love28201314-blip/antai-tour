<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>木地板評估室｜3D 模型展示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
      background: #1a1a2e;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #fbbf24;
      z-index: 100;
      max-width: 320px;
    }

    #title {
      font-size: 20px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 8px;
    }

    #desc {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.9;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      z-index: 100;
      font-size: 13px;
      line-height: 1.8;
    }

    #view-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .view-btn {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .view-btn:hover {
      background: linear-gradient(135deg, #667eea, #764ba2);
      transform: translateX(-5px);
    }

    .view-btn.active {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #10b981;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1e1e2e, #0a0a0f);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      color: white;
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
    }

    #status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(16, 185, 129, 0.9);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="info">
  <div id="title">木地板評估室</div>
  <div id="desc">深色木質天花板空間，配備大型木衣櫃與廚房設施</div>
</div>

<div id="controls">
  <strong>🎮 操作說明</strong><br>
  滑鼠拖曳：旋轉房間<br>
  滾輪：縮放遠近<br>
  右鍵拖曳：平移視角
</div>

<div id="view-toggle">
  <button class="view-btn active" onclick="setView('inside')">
    📷 室內視角
  </button>
  <button class="view-btn" onclick="setView('outside')">
    🏠 外部觀察
  </button>
  <button class="view-btn" onclick="resetCamera()">
    🔄 重設視角
  </button>
</div>

<div id="status">✅ 3D 模型已載入</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">建構 3D 房間模型...</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 房間參數（基於照片分析）
const ROOM = {
  width: 8,      // 房間寬度 8 米
  height: 3.2,   // 房間高度 3.2 米
  depth: 6,      // 房間深度 6 米
  photo: 'S__23953432_0.jpg'  // 使用第一張照片
};

let scene, camera, renderer, controls;
let room;

function init() {
  // 場景
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  
  // 相機（室內視角）
  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 1.6, 3);  // 模擬人眼高度（1.6米）站在房間中央
  
  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  
  // 光源
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  
  const pointLight1 = new THREE.PointLight(0xfff8e1, 0.6, 20);
  pointLight1.position.set(0, ROOM.height - 0.5, 0);
  pointLight1.castShadow = true;
  scene.add(pointLight1);
  
  const pointLight2 = new THREE.PointLight(0xffffff, 0.4, 15);
  pointLight2.position.set(-3, ROOM.height - 1, 2);
  scene.add(pointLight2);
  
  // 軌道控制
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 1;
  controls.maxDistance = 15;
  controls.maxPolarAngle = Math.PI / 1.5;
  controls.target.set(0, 1.6, 0);
  
  // 建立房間
  buildRoom();
  
  // 事件監聽
  window.addEventListener('resize', onResize);
  
  // 開始渲染
  animate();
  
  // 隱藏載入畫面
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 1000);
}

function buildRoom() {
  room = new THREE.Group();
  
  const textureLoader = new THREE.TextureLoader();
  
  // 載入真實照片作為紋理
  textureLoader.load(
    ROOM.photo,
    (texture) => {
      // 地板（深色木地板）
      const floorGeo = new THREE.PlaneGeometry(ROOM.width, ROOM.depth);
      const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x4a3f35,
        roughness: 0.8,
        metalness: 0.1
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      room.add(floor);
      
      // 天花板（深色木質）
      const ceilingGeo = new THREE.PlaneGeometry(ROOM.width, ROOM.depth);
      const ceilingMat = new THREE.MeshStandardMaterial({ 
        color: 0x3d2f1f,
        roughness: 0.9
      });
      const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = ROOM.height;
      ceiling.receiveShadow = true;
      room.add(ceiling);
      
      // 牆壁材質（使用真實照片）
      const wallMat = new THREE.MeshStandardMaterial({ 
        map: texture,
        side: THREE.FrontSide
      });
      
      // 前牆（正對照片的牆）
      const frontWall = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM.width, ROOM.height),
        wallMat
      );
      frontWall.position.z = -ROOM.depth / 2;
      frontWall.position.y = ROOM.height / 2;
      frontWall.castShadow = true;
      frontWall.receiveShadow = true;
      room.add(frontWall);
      
      // 後牆
      const backWall = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM.width, ROOM.height),
        new THREE.MeshStandardMaterial({ color: 0xf5f5dc, side: THREE.FrontSide })
      );
      backWall.position.z = ROOM.depth / 2;
      backWall.position.y = ROOM.height / 2;
      backWall.rotation.y = Math.PI;
      backWall.castShadow = true;
      backWall.receiveShadow = true;
      room.add(backWall);
      
      // 左牆
      const leftWall = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM.depth, ROOM.height),
        wallMat.clone()
      );
      leftWall.position.x = -ROOM.width / 2;
      leftWall.position.y = ROOM.height / 2;
      leftWall.rotation.y = Math.PI / 2;
      leftWall.castShadow = true;
      leftWall.receiveShadow = true;
      room.add(leftWall);
      
      // 右牆
      const rightWall = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM.depth, ROOM.height),
        wallMat.clone()
      );
      rightWall.position.x = ROOM.width / 2;
      rightWall.position.y = ROOM.height / 2;
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.castShadow = true;
      rightWall.receiveShadow = true;
      room.add(rightWall);
      
      // 加入大型木衣櫃（基於照片觀察）
      const cabinetGeo = new THREE.BoxGeometry(2, 2.5, 0.6);
      const cabinetMat = new THREE.MeshStandardMaterial({ 
        color: 0x5d4037,
        roughness: 0.7
      });
      const cabinet = new THREE.Mesh(cabinetGeo, cabinetMat);
      cabinet.position.set(-2.5, 1.25, -2.7);
      cabinet.castShadow = true;
      cabinet.receiveShadow = true;
      room.add(cabinet);
      
      // 廚房區域櫃子
      const kitchenCounter = new THREE.Mesh(
        new THREE.BoxGeometry(3, 0.9, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.6 })
      );
      kitchenCounter.position.set(2, 0.45, -2.7);
      kitchenCounter.castShadow = true;
      kitchenCounter.receiveShadow = true;
      room.add(kitchenCounter);
      
      // 天花板橫樑（深色木質）
      const beamGeo = new THREE.BoxGeometry(ROOM.width, 0.3, 0.3);
      const beamMat = new THREE.MeshStandardMaterial({ color: 0x3d2f1f });
      const beam1 = new THREE.Mesh(beamGeo, beamMat);
      beam1.position.set(0, ROOM.height - 0.15, -1);
      room.add(beam1);
      
      const beam2 = new THREE.Mesh(beamGeo, beamMat);
      beam2.position.set(0, ROOM.height - 0.15, 1);
      room.add(beam2);
      
      scene.add(room);
      
      console.log('✅ 房間 3D 模型建立完成');
    },
    undefined,
    (error) => {
      console.warn('照片載入失敗，使用預設材質');
      
      // 即使照片載入失敗，仍建立基本房間結構
      const floorGeo = new THREE.PlaneGeometry(ROOM.width, ROOM.depth);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x4a3f35 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      room.add(floor);
      
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc });
      
      const frontWall = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM.width, ROOM.height),
        wallMat
      );
      frontWall.position.z = -ROOM.depth / 2;
      frontWall.position.y = ROOM.height / 2;
      room.add(frontWall);
      
      scene.add(room);
    }
  );
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// 切換視角
window.setView = function(view) {
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  
  if (view === 'inside') {
    // 室內視角（第一人稱）
    camera.position.set(0, 1.6, 3);
    controls.target.set(0, 1.6, 0);
    controls.maxPolarAngle = Math.PI / 1.5;
    document.querySelectorAll('.view-btn')[0].classList.add('active');
  } else {
    // 外部觀察視角
    camera.position.set(8, 5, 8);
    controls.target.set(0, 1, 0);
    controls.maxPolarAngle = Math.PI / 2;
    document.querySelectorAll('.view-btn')[1].classList.add('active');
  }
};

// 重設相機
window.resetCamera = function() {
  camera.position.set(0, 1.6, 3);
  controls.target.set(0, 1.6, 0);
  document.querySelectorAll('.view-btn')[0].classList.add('active');
  document.querySelectorAll('.view-btn')[1].classList.remove('active');
};

init();
</script>

</body>
</html>
