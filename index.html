<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安台共造園區｜互動式 3D 虛擬空間</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      overflow: hidden;
      background: #000;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* HUD 介面 */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      padding: 20px 30px;
      color: white;
    }

    #mode-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    #mode-badge.current {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    #mode-badge.future {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    #space-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 5px;
      text-shadow: 0 3px 15px rgba(0,0,0,0.9);
    }

    #space-desc {
      font-size: 16px;
      opacity: 0.9;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    /* 控制面板 */
    #controls-panel {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      padding: 20px;
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: white;
      pointer-events: all;
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fbbf24;
    }

    .control-hint {
      font-size: 13px;
      opacity: 0.8;
      line-height: 1.6;
    }

    .kbd {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 700;
      margin: 0 2px;
    }

    /* 模式切換按鈕 */
    #mode-toggle {
      position: absolute;
      top: 30px;
      right: 30px;
      pointer-events: all;
    }

    .mode-btn {
      display: block;
      width: 100%;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .mode-btn:hover {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: #fbbf24;
      transform: scale(1.05);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
    }

    /* 小地圖 */
    #minimap {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 250px;
      height: 250px;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      pointer-events: all;
      padding: 15px;
    }

    #minimap-title {
      color: white;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
    }

    #minimap-canvas {
      width: 100%;
      height: calc(100% - 30px);
      border-radius: 8px;
    }

    /* 準心 */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }

    #crosshair::before {
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      transform: translateY(-50%);
    }

    #crosshair::after {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      transform: translateX(-50%);
    }

    /* 物件資訊面板 */
    #object-info {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      padding: 25px 35px;
      border-radius: 18px;
      border: 3px solid #fbbf24;
      color: white;
      display: none;
      pointer-events: all;
      max-width: 500px;
    }

    #object-info.show {
      display: block;
    }

    #object-name {
      font-size: 24px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 10px;
    }

    #object-desc {
      font-size: 16px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .action-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
    }

    .action-btn.delete {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }

    /* 載入畫面 */
    #loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1e1e2e 0%, #0a0a0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 80px;
      height: 80px;
      border: 6px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      color: white;
      margin-top: 25px;
      font-size: 22px;
      font-weight: 700;
    }

    #loading-progress {
      color: #10b981;
      margin-top: 15px;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      #controls-panel {
        bottom: 10px;
        left: 10px;
        padding: 12px;
        font-size: 12px;
      }
      #minimap {
        width: 150px;
        height: 150px;
        bottom: 10px;
        right: 10px;
      }
      #mode-toggle {
        top: 10px;
        right: 10px;
      }
      .mode-btn {
        padding: 10px 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud">
  <div id="top-bar">
    <div id="mode-badge" class="current">🏛️ 現況場景</div>
    <div id="space-title">載入中...</div>
    <div id="space-desc">正在建構 3D 空間</div>
  </div>

  <div id="crosshair"></div>

  <div id="controls-panel">
    <div class="control-group">
      <div class="control-title">🎮 移動控制</div>
      <div class="control-hint">
        <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> 前後左右移動<br>
        <span class="kbd">滑鼠</span> 環視四周<br>
        <span class="kbd">Shift</span> 加速移動<br>
        <span class="kbd">Space</span> 跳躍（穿越門檻）
      </div>
    </div>
    <div class="control-group">
      <div class="control-title">🎯 互動操作</div>
      <div class="control-hint">
        <span class="kbd">滑鼠左鍵</span> 點擊物件互動<br>
        <span class="kbd">E</span> 切換樓層<br>
        <span class="kbd">R</span> 重設位置
      </div>
    </div>
  </div>

  <div id="mode-toggle">
    <button class="mode-btn active" onclick="switchMode('current')">
      🏛️ 現況場景
    </button>
    <button class="mode-btn" onclick="switchMode('future')">
      ✨ 未來改造
    </button>
  </div>

  <div id="minimap">
    <div id="minimap-title">📍 當前位置</div>
    <canvas id="minimap-canvas"></canvas>
  </div>

  <div id="object-info">
    <div id="object-name">物件名稱</div>
    <div id="object-desc">物件描述</div>
    <div class="action-btns">
      <button class="action-btn" onclick="rotateObject()">🔄 旋轉</button>
      <button class="action-btn" onclick="moveObject()">📐 移動</button>
      <button class="action-btn delete" onclick="deleteObject()">🗑️ 刪除</button>
      <button class="action-btn" onclick="closeObjectInfo()">✕ 關閉</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">建構 3D 空間中...</div>
  <div id="loading-progress">載入材質與紋理 (0/10)</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ========================================
// 場域空間資料結構
// ========================================
const SPACES = [
  {
    id: 'room-01',
    name: '木地板評估室',
    desc: '深色木天花板空間，配備大型木質衣櫃',
    image: 'S__23953432_0.jpg',
    position: { x: 0, y: 0, z: 0 },
    size: { w: 8, h: 3, d: 6 },
    floor: 2,
    doors: [{ to: 'room-02', position: { x: 4, z: 0 } }]
  },
  {
    id: 'room-02',
    name: '無障礙衛浴',
    desc: '白色磁磚浴室，配備古典金腳浴缸',
    image: 'S__23953433_0.jpg',
    position: { x: 10, y: 0, z: 0 },
    size: { w: 5, h: 3, d: 4 },
    floor: 2,
    doors: [{ to: 'room-01', position: { x: 0, z: 2 } }]
  },
  {
    id: 'room-03',
    name: '地板過渡區',
    desc: '黑白棋盤地板與木地板交界',
    image: 'S__23953434_0.jpg',
    position: { x: 0, y: 0, z: -8 },
    size: { w: 8, h: 3, d: 5 },
    floor: 2,
    doors: [{ to: 'room-01', position: { x: 4, z: 5 } }]
  },
  {
    id: 'room-04',
    name: '主活動客廳',
    desc: '黑白棋盤地板主廳，配備大窗景',
    image: 'S__23953435_0.jpg',
    position: { x: -12, y: 0, z: 0 },
    size: { w: 10, h: 3.5, d: 8 },
    floor: 2,
    doors: [{ to: 'room-01', position: { x: 10, z: 4 } }]
  },
  {
    id: 'room-05',
    name: '二樓樓梯平台',
    desc: '挑高天井空間，鐵藝欄杆',
    image: 'S__23953436_0.jpg',
    position: { x: 0, y: 0, z: 10 },
    size: { w: 6, h: 5, d: 6 },
    floor: 2,
    doors: [{ to: 'room-01', position: { x: 3, z: 0 } }]
  },
  {
    id: 'room-06',
    name: '電梯迎賓廳',
    desc: '金色菱形電梯門',
    image: 'S__23953437_0.jpg',
    position: { x: 8, y: 0, z: 10 },
    size: { w: 5, h: 3, d: 5 },
    floor: 2,
    doors: [{ to: 'room-05', position: { x: 0, z: 2.5 } }]
  },
  {
    id: 'room-07',
    name: '一樓挑高客廳',
    desc: '磨石子地板挑高空間',
    image: 'S__23953438_0.jpg',
    position: { x: 0, y: -4, z: 0 },
    size: { w: 12, h: 6, d: 10 },
    floor: 1,
    doors: []
  },
  {
    id: 'room-08',
    name: '休閒交流客廳',
    desc: '橘色皮沙發與鳥類裝飾',
    image: 'S__23953439_0.jpg',
    position: { x: -15, y: -4, z: 0 },
    size: { w: 8, h: 3, d: 7 },
    floor: 1,
    doors: []
  },
  {
    id: 'room-09',
    name: '主要通道長廊',
    desc: '磨石子地板長廊',
    image: 'S__23953440_0.jpg',
    position: { x: 0, y: -4, z: -12 },
    size: { w: 15, h: 3, d: 4 },
    floor: 1,
    doors: []
  },
  {
    id: 'room-10',
    name: '樓梯轉角展示區',
    desc: '黑白棋盤地板樓梯',
    image: 'S__23953441_0.jpg',
    position: { x: 10, y: -4, z: -8 },
    size: { w: 6, h: 5, d: 6 },
    floor: 1,
    doors: []
  }
];

// 未來改造家具資料
const FUTURE_FURNITURE = [
  { type: 'table', name: '圓角認知桌', position: { x: -14, y: -3.2, z: 2 }, size: { w: 2, h: 0.8, d: 1.5 } },
  { type: 'chair', name: '安全扶手椅', position: { x: -15, y: -3.5, z: 2 }, size: { w: 0.6, h: 1, d: 0.6 } },
  { type: 'cabinet', name: '教具收納櫃', position: { x: -18, y: -3.5, z: 0 }, size: { w: 1.5, h: 2, d: 0.5 } },
  { type: 'tv', name: '75吋互動螢幕', position: { x: 2, y: 0.5, z: -2.9 }, size: { w: 1.8, h: 1, d: 0.1 } }
];

// ========================================
// Three.js 場景初始化
// ========================================
let scene, camera, renderer, controls;
let currentMode = 'current';
let currentFloor = 2;
let rooms = [];
let furnitureObjects = [];
let selectedObject = null;

// 玩家移動狀態
const player = {
  position: new THREE.Vector3(0, 1.6, 0),
  velocity: new THREE.Vector3(),
  rotation: new THREE.Euler(0, 0, 0, 'YXZ'),
  moveSpeed: 0.1,
  lookSpeed: 0.002,
  onGround: true
};

const keys = {};
let pointerLocked = false;

function init() {
  const container = document.getElementById('canvas-container');
  
  // 場景
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 20, 50);
  
  // 相機
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.copy(player.position);
  
  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);
  
  // 光源
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(10, 20, 10);
  directionalLight.castShadow = true;
  directionalLight.shadow.camera.left = -30;
  directionalLight.shadow.camera.right = 30;
  directionalLight.shadow.camera.top = 30;
  directionalLight.shadow.camera.bottom = -30;
  scene.add(directionalLight);
  
  // 建立空間
  buildSpaces();
  
  // 指標鎖定控制
  setupPointerLock(container);
  
  // 鍵盤控制
  setupKeyboard();
  
  // 滑鼠點擊互動
  setupMouseClick();
  
  // 視窗調整
  window.addEventListener('resize', onWindowResize);
  
  // 更新 UI
  updateUI();
  
  // 開始渲染
  animate();
  
  // 載入完成
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 2000);
}

// ========================================
// 建立 3D 空間
// ========================================
function buildSpaces() {
  const textureLoader = new THREE.TextureLoader();
  let loadedCount = 0;
  
  SPACES.forEach((spaceData, index) => {
    textureLoader.load(
      spaceData.image,
      (texture) => {
        const room = createRoom(spaceData, texture);
        rooms.push({ data: spaceData, mesh: room });
        scene.add(room);
        
        loadedCount++;
        document.getElementById('loading-progress').textContent = 
          `載入材質與紋理 (${loadedCount}/${SPACES.length})`;
      },
      undefined,
      (error) => {
        console.warn(`無法載入 ${spaceData.image}，使用預設紋理`);
        const room = createRoom(spaceData, null);
        rooms.push({ data: spaceData, mesh: room });
        scene.add(room);
        
        loadedCount++;
        document.getElementById('loading-progress').textContent = 
          `載入材質與紋理 (${loadedCount}/${SPACES.length})`;
      }
    );
  });
}

function createRoom(spaceData, texture) {
  const group = new THREE.Group();
  const { w, h, d } = spaceData.size;
  const { x, y, z } = spaceData.position;
  
  group.position.set(x, y, z);
  
  // 地板
  const floorGeo = new THREE.PlaneGeometry(w, d);
  const floorMat = new THREE.MeshStandardMaterial({ 
    color: 0x8b7355,
    roughness: 0.8
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  group.add(floor);
  
  // 牆壁（使用照片紋理）
  const wallMat = texture 
    ? new THREE.MeshStandardMaterial({ map: texture })
    : new THREE.MeshStandardMaterial({ color: 0xf5f5dc });
  
  // 前牆
  const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  frontWall.position.set(0, h/2, -d/2);
  frontWall.castShadow = true;
  frontWall.receiveShadow = true;
  group.add(frontWall);
  
  // 後牆
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat.clone());
  backWall.position.set(0, h/2, d/2);
  backWall.rotation.y = Math.PI;
  backWall.castShadow = true;
  backWall.receiveShadow = true;
  group.add(backWall);
  
  // 左牆
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(d, h), wallMat.clone());
  leftWall.position.set(-w/2, h/2, 0);
  leftWall.rotation.y = Math.PI / 2;
  leftWall.castShadow = true;
  leftWall.receiveShadow = true;
  group.add(leftWall);
  
  // 右牆
  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(d, h), wallMat.clone());
  rightWall.position.set(w/2, h/2, 0);
  rightWall.rotation.y = -Math.PI / 2;
  rightWall.castShadow = true;
