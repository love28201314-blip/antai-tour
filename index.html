<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安台共造園區｜3D虛擬導覽</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
      background: #000;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #fbbf24;
      z-index: 100;
      max-width: 350px;
    }

    #mode-badge {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #mode-badge.current {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    #mode-badge.future {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    #title {
      font-size: 22px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 8px;
    }

    #desc {
      font-size: 14px;
      line-height: 1.5;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      z-index: 100;
      font-size: 13px;
      line-height: 1.8;
    }

    #mode-btns {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mode-btn {
      padding: 12px 25px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .mode-btn:hover {
      background: linear-gradient(135deg, #667eea, #764ba2);
      transform: translateX(-5px);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #10b981;
    }

    #navigator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 15px;
      z-index: 100;
      max-width: 250px;
      max-height: 60vh;
      overflow-y: auto;
    }

    #nav-title {
      color: #fbbf24;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 2px solid rgba(251, 191, 36, 0.3);
      padding-bottom: 8px;
    }

    .room-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      margin: 6px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }

    .room-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .room-btn.active {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
      color: #fbbf24;
      border: 2px solid rgba(251, 191, 36, 0.5);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }

    .room-btn.active .dot {
      background: #fbbf24;
      box-shadow: 0 0 10px #fbbf24;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1e1e2e, #0a0a0f);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      color: white;
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="info">
  <div id="mode-badge" class="current">🏛️ 現況場景</div>
  <div id="title">安台共造園區</div>
  <div id="desc">載入中...</div>
</div>

<div id="controls">
  <strong>🎮 操作說明</strong><br>
  滑鼠拖曳：旋轉視角<br>
  滾輪：縮放遠近<br>
  點擊房間：切換空間
</div>

<div id="mode-btns">
  <button class="mode-btn active" onclick="setMode('current')">
    🏛️ 現況場景
  </button>
  <button class="mode-btn" onclick="setMode('future')">
    ✨ 未來改造
  </button>
</div>

<div id="navigator">
  <div id="nav-title">🗺️ 空間導覽</div>
  <div id="room-list"></div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">建構 3D 空間...</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ROOMS = [
  { id: 1, name: '木地板評估室', desc: '深色木天花板空間', img: 'S__23953432_0.jpg', pos: [0, 4, 0], size: [8, 3, 6], floor: '2F' },
  { id: 2, name: '無障礙衛浴', desc: '白色磁磚浴室', img: 'S__23953433_0.jpg', pos: [10, 4, 0], size: [4.5, 3, 3.5], floor: '2F' },
  { id: 3, name: '玄關過渡區', desc: '黑白棋盤地板', img: 'S__23953434_0.jpg', pos: [0, 4, -8], size: [8, 3, 5], floor: '2F' },
  { id: 4, name: '主活動客廳', desc: '書櫃與沙發區', img: 'S__23953435_0.jpg', pos: [-12, 4, 0], size: [10, 3, 8], floor: '2F' },
  { id: 5, name: '二樓平台', desc: '挑高天井空間', img: 'S__23953436_0.jpg', pos: [0, 4, 10], size: [6, 5, 6], floor: '2F' },
  { id: 6, name: '電梯迎賓廳', desc: '金色電梯門', img: 'S__23953437_0.jpg', pos: [8, 4, 10], size: [5, 3.5, 5], floor: '2F' },
  { id: 7, name: '一樓客廳', desc: '挑高迎賓空間', img: 'S__23953438_0.jpg', pos: [0, 0, 0], size: [12, 6, 10], floor: '1F' },
  { id: 8, name: '休閒客廳', desc: '橘色沙發區', img: 'S__23953439_0.jpg', pos: [-15, 0, 0], size: [8, 3.5, 7], floor: '1F' },
  { id: 9, name: '主通道長廊', desc: '磨石子地板', img: 'S__23953440_0.jpg', pos: [0, 0, -12], size: [15, 3.5, 4], floor: '1F' },
  { id: 10, name: '樓梯轉角', desc: '黑白棋盤樓梯', img: 'S__23953441_0.jpg', pos: [10, 0, -8], size: [6, 5, 6], floor: '1F' }
];

const FURNITURE = [
  { name: '認知活動桌', pos: [-14, 0.8, 2], size: [2, 0.8, 1.5], color: 0xf4a460 },
  { name: '安全扶手椅', pos: [-15.5, 0.5, 2], size: [0.6, 1, 0.6], color: 0x4682b4 },
  { name: '教具收納櫃', pos: [-18, 1, 0], size: [1.5, 2, 0.5], color: 0x8b4513 },
  { name: '互動螢幕', pos: [2, 2, -11.8], size: [1.8, 1, 0.1], color: 0x1a1a1a }
];

let scene, camera, renderer, controls;
let roomGroups = [];
let furnitureGroup = new THREE.Group();
let currentMode = 'current';
let currentRoomId = 1;
let loaded = 0;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(18, 12, 18);
  
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  
  const light1 = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(light1);
  
  const light2 = new THREE.DirectionalLight(0xffffff, 0.6);
  light2.position.set(30, 40, 30);
  light2.castShadow = true;
  scene.add(light2);
  
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI / 2;
  
  buildScene();
  buildFurniture();
  renderNav();
  
  window.addEventListener('resize', onResize);
  animate();
}

function buildScene() {
  const loader = new THREE.TextureLoader();
  
  ROOMS.forEach(room => {
    loader.load(
      room.img,
      (tex) => {
        createRoom(room, tex);
        loaded++;
        if (loaded === 10) finishLoading();
      },
      undefined,
      () => {
        createRoom(room, null);
        loaded++;
        if (loaded === 10) finishLoading();
      }
    );
  });
}

function createRoom(data, texture) {
  const group = new THREE.Group();
  const [x, y, z] = data.pos;
  const [w, h, d] = data.size;
  
  group.position.set(x, y, z);
  group.userData = { roomId: data.id, roomName: data.name, roomDesc: data.desc };
  
  const floorGeo = new THREE.BoxGeometry(w, 0.1, d);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b8680 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.receiveShadow = true;
  group.add(floor);
  
  const wallMat = texture 
    ? new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide })
    : new THREE.MeshStandardMaterial({ color: 0xf5f5dc, side: THREE.DoubleSide });
  
  const walls = [
    { g: new THREE.PlaneGeometry(w, h), p: [0, h/2, -d/2], r: [0, 0, 0] },
    { g: new THREE.PlaneGeometry(w, h), p: [0, h/2, d/2], r: [0, Math.PI, 0] },
    { g: new THREE.PlaneGeometry(d, h), p: [-w/2, h/2, 0], r: [0, Math.PI/2, 0] },
    { g: new THREE.PlaneGeometry(d, h), p: [w/2, h/2, 0], r: [0, -Math.PI/2, 0] }
  ];
  
  walls.forEach(w => {
    const wall = new THREE.Mesh(w.g, wallMat.clone());
    wall.position.set(...w.p);
    wall.rotation.set(...w.r);
    wall.castShadow = true;
    wall.receiveShadow = true;
    group.add(wall);
  });
  
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ color: 0xe0e0e0, side: THREE.DoubleSide })
  );
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = h;
  group.add(ceiling);
  
  const labelGeo = new THREE.SphereGeometry(0.3);
  const labelMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
  const label = new THREE.Mesh(labelGeo, labelMat);
  label.position.y = h + 0.8;
  group.add(label);
  
  scene.add(group);
  roomGroups.push({ data, group });
}

function buildFurniture() {
  FURNITURE.forEach(item => {
    const [w, h, d] = item.size;
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color: item.color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...item.pos);
    mesh.castShadow = true;
    furnitureGroup.add(mesh);
  });
  
  scene.add(furnitureGroup);
  furnitureGroup.visible = false;
}

function renderNav() {
  const list = document.getElementById('room-list');
  ROOMS.forEach(room => {
    const btn = document.createElement('button');
    btn.className = 'room-btn';
    btn.innerHTML = `<div class="dot"></div><span>${room.floor} ${room.name}</span>`;
    btn.onclick = () => focusRoom(room.id);
    list.appendChild(btn);
  });
}

function focusRoom(id) {
  currentRoomId = id;
  const room = ROOMS.find(r => r.id === id);
  const [x, y, z] = room.pos;
  
  controls.target.set(x, y + 1.5, z);
  camera.position.set(x + 12, y + 8, z + 12);
  
  document.getElementById('title').textContent = room.name;
  document.getElementById('desc').textContent = room.desc;
  
  document.querySelectorAll('.room-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === id - 1);
  });
}

function finishLoading() {
  document.getElementById('loading').classList.add('hidden');
  focusRoom(1);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.setMode = function(mode) {
  currentMode = mode;
  furnitureGroup.visible = (mode === 'future');
  
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  
  const badge = document.getElementById('mode-badge');
  if (mode === 'current') {
    document.querySelectorAll('.mode-btn')[0].classList.add('active');
    badge.className = 'current';
    badge.textContent = '🏛️ 現況場景';
  } else {
    document.querySelectorAll('.mode-btn')[1].classList.add('active');
    badge.className = 'future';
    badge.textContent = '✨ 未來改造';
  }
};

init();
</script>

</body>
</html>
