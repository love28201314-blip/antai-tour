<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安台共造園區｜虛擬導覽（除錯版）</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
    }

    body {
      background: #1a1a2e;
      color: white;
      overflow: hidden;
    }

    #debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255, 0, 0, 0.9);
      padding: 15px;
      border-radius: 10px;
      z-index: 9999;
      font-size: 14px;
      max-width: 500px;
      font-family: monospace;
    }

    #viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #current-image {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border: 5px solid #fbbf24;
      border-radius: 15px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
    }

    #info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 20px 40px;
      border-radius: 15px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    #space-title {
      font-size: 28px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 10px;
    }

    #space-desc {
      font-size: 16px;
      color: #fff;
    }

    .nav-buttons {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      color: white;
      margin-top: 25px;
      font-size: 20px;
      font-weight: 700;
    }

    #error-msg {
      color: #ff4444;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="debug-panel">
  <strong>🔍 除錯資訊：</strong><br>
  <span id="debug-info">正在檢查檔案...</span>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">檢查照片檔案中...</div>
  <div id="error-msg"></div>
</div>

<div id="viewer" style="display: none;">
  <div id="info">
    <div id="space-title">載入中...</div>
    <div id="space-desc">準備顯示照片</div>
  </div>

  <img id="current-image" src="" alt="場域照片" />

  <div class="nav-buttons">
    <button class="nav-btn" id="btn-prev">◀ 上一張</button>
    <button class="nav-btn" id="btn-next">下一張 ▶</button>
  </div>
</div>

<script>
// 簡化的照片列表（只用檔名）
const PHOTOS = [
  {
    file: 'S__23953432_0.jpg',
    title: '1. 木地板房間',
    desc: '深色木天花板空間'
  },
  {
    file: 'S__23953433_0.jpg',
    title: '2. 浴室',
    desc: '白色磁磚浴室'
  },
  {
    file: 'S__23953434_0.jpg',
    title: '3. 過渡區',
    desc: '黑白棋盤地板交界'
  },
  {
    file: 'S__23953435_0.jpg',
    title: '4. 主客廳',
    desc: '黑白棋盤地板主廳'
  },
  {
    file: 'S__23953436_0.jpg',
    title: '5. 二樓平台',
    desc: '挑高天井空間'
  },
  {
    file: 'S__23953437_0.jpg',
    title: '6. 電梯區',
    desc: '金色電梯門'
  },
  {
    file: 'S__23953438_0.jpg',
    title: '7. 一樓客廳',
    desc: '挑高迎賓空間'
  },
  {
    file: 'S__23953439_0.jpg',
    title: '8. 休閒區',
    desc: '橘色皮沙發區'
  },
  {
    file: 'S__23953440_0.jpg',
    title: '9. 長廊',
    desc: '磨石子地板長廊'
  },
  {
    file: 'S__23953441_0.jpg',
    title: '10. 樓梯區',
    desc: '黑白棋盤樓梯'
  }
];

let currentIndex = 0;
let loadedPhotos = [];

const debugInfo = document.getElementById('debug-info');
const loadingScreen = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');
const errorMsg = document.getElementById('error-msg');
const viewer = document.getElementById('viewer');
const currentImage = document.getElementById('current-image');
const spaceTitle = document.getElementById('space-title');
const spaceDesc = document.getElementById('space-desc');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

// 檢查所有照片是否存在
async function checkAllPhotos() {
  debugInfo.innerHTML = '正在檢查 10 張照片...<br>';
  loadingText.textContent = '正在檢查照片檔案...';

  for (let i = 0; i < PHOTOS.length; i++) {
    const photo = PHOTOS[i];
    const exists = await checkPhoto(photo.file);
    
    if (exists) {
      loadedPhotos.push(photo);
      debugInfo.innerHTML += `✅ ${photo.file} - 找到了！<br>`;
    } else {
      debugInfo.innerHTML += `❌ ${photo.file} - 找不到！<br>`;
    }
  }

  if (loadedPhotos.length === 0) {
    errorMsg.textContent = `❌ 錯誤：找不到任何照片檔案！請確認檔案是否放在 index.html 同一個資料夾。`;
    debugInfo.innerHTML += '<br><strong style="color: yellow;">⚠️ 所有照片都找不到！請檢查檔案位置。</strong>';
  } else {
    debugInfo.innerHTML += `<br><strong style="color: lime;">✅ 成功找到 ${loadedPhotos.length} 張照片！</strong>`;
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
      viewer.style.display = 'block';
      showPhoto(0);
    }, 1500);
  }
}

// 檢查單張照片是否存在
function checkPhoto(filename) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = filename;
  });
}

// 顯示照片
function showPhoto(index) {
  if (index < 0 || index >= loadedPhotos.length) return;
  
  currentIndex = index;
  const photo = loadedPhotos[index];
  
  currentImage.src = photo.file;
  spaceTitle.textContent = photo.title;
  spaceDesc.textContent = photo.desc;
  
  btnPrev.disabled = (index === 0);
  btnNext.disabled = (index === loadedPhotos.length - 1);
  
  debugInfo.innerHTML = `當前顯示：${photo.file} (${index + 1}/${loadedPhotos.length})`;
}

// 按鈕事件
btnPrev.onclick = () => showPhoto(currentIndex - 1);
btnNext.onclick = () => showPhoto(currentIndex + 1);

// 鍵盤快捷鍵
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') btnPrev.click();
  if (e.key === 'ArrowRight') btnNext.click();
});

// 啟動檢查
checkAllPhotos();
</script>

</body>
</html>
