<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安台共造園區｜互動式 3D 虛擬空間</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      overflow: hidden;
      background: #1a1a2e;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    #info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 20px 25px;
      border-radius: 15px;
      border: 2px solid rgba(251, 191, 36, 0.5);
      z-index: 100;
      max-width: 350px;
    }

    #mode-badge {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #mode-badge.current {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    #mode-badge.future {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    #room-name {
      font-size: 22px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 5px;
    }

    #room-desc {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.5;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      z-index: 100;
      font-size: 13px;
      line-height: 1.8;
    }

    .key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 700;
    }

    #mode-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mode-btn {
      padding: 12px 25px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .mode-btn:hover {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transform: translateX(-5px);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
    }

    #start-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(251, 191, 36, 0.95);
      color: #000;
      padding: 20px 40px;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 700;
      z-index: 200;
      cursor: pointer;
      animation: pulse 2s infinite;
    }

    #start-hint.hidden {
      display: none;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    #status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.9);
      color: #10b981;
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid #10b981;
      z-index: 100;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="info-panel">
  <div id="mode-badge" class="current">🏛️ 現況場景</div>
  <div id="room-name">安台共造園區</div>
  <div id="room-desc">3D 虛擬空間已就緒，點擊畫面開始探索</div>
</div>

<div id="controls">
  <strong>🎮 操作說明</strong><br>
  <span class="key">滑鼠拖曳</span> 旋轉視角<br>
  <span class="key">滾輪</span> 縮放<br>
  <span class="key">右鍵拖曳</span> 平移視角<br>
  <span class="key">數字 1-9</span> 切換房間
</div>

<div id="mode-buttons">
  <button class="mode-btn active" onclick="setMode('current')">
    🏛️ 現況場景
  </button>
  <button class="mode-btn" onclick="setMode('future')">
    ✨ 未來改造
  </button>
</div>

<div id="start-hint" onclick="startExplore()">
  👆 點擊開始 3D 探索
</div>

<div id="status">✅ 系統運作中</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =============================================
// 場域空間資料
// =============================================
const SPACES = [
  { id: 1, name: '木地板評估室', desc: '深色木天花板空間', pos: [0, 0, 0], size: [8, 3.5, 6], color: 0x8b6f47 },
  { id: 2, name: '無障礙衛浴', desc: '白色磁磚浴室', pos: [10, 0, 0], size: [5, 3, 4], color: 0xf5f5f5 },
  { id: 3, name: '地板過渡區', desc: '黑白棋盤交界', pos: [0, 0, -8], size: [8, 3.5, 5], color: 0x404040 },
  { id: 4, name: '主活動客廳', desc: '黑白棋盤地板主廳', pos: [-12, 0, 0], size: [10, 3.5, 8], color: 0x2d2d2d },
  { id: 5, name: '二樓平台', desc: '挑高天井空間', pos: [0, 0, 10], size: [6, 5, 6], color: 0xdcdcdc },
  { id: 6, name: '電梯迎賓廳', desc: '金色電梯門', pos: [8, 0, 10], size: [5, 3.5, 5], color: 0xd4af37 },
  { id: 7, name: '一樓客廳', desc: '磨石子挑高空間', pos: [0, -5, 0], size: [12, 6, 10], color: 0x8b8680 },
  { id: 8, name: '休閒客廳', desc: '橘色沙發區', pos: [-15, -5, 0], size: [8, 3.5, 7], color: 0xcd853f },
  { id: 9, name: '主通道長廊', desc: '磨石子長廊', pos: [0, -5, -12], size: [15, 3.5, 4], color: 0xa0a0a0 },
  { id: 10, name: '樓梯轉角', desc: '黑白棋盤樓梯', pos: [10, -5, -8], size: [6, 5, 6], color: 0x1a1a1a }
];

const FURNITURE = [
  { name: '圓角認知桌', pos: [-14, -4.2, 2], size: [2, 0.8, 1.5], color: 0xf4a460 },
  { name: '安全扶手椅', pos: [-15.5, -4.5, 2], size: [0.6, 1, 0.6], color: 0x4682b4 },
  { name: '教具收納櫃', pos: [-18, -4.5, 0], size: [1.5, 2, 0.5], color: 0x8b4513 },
  { name: '互動螢幕', pos: [2, -3.5, -4.9], size: [1.8, 1, 0.1], color: 0x000000 }
];

// =============================================
// Three.js 初始化
// =============================================
let scene, camera, renderer, controls;
let roomMeshes = [];
let furnitureGroup = new THREE.Group();
let currentMode = 'current';

function init() {
  // 場景
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 0, 100);

  // 相機
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(20, 15, 20);
  camera.lookAt(0, 0, 0);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.setPixelRatio(window.devicePixelRatio);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // 光源
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
  sunLight.position.set(30, 40, 30);
  sunLight.castShadow = true;
  sunLight.shadow.camera.left = -50;
  sunLight.shadow.camera.right = 50;
  sunLight.shadow.camera.top = 50;
  sunLight.shadow.camera.bottom = -50;
  scene.add(sunLight);

  // 軌道控制
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2;
  controls.minDistance = 5;
  controls.maxDistance = 80;

  // 建立場景
  buildScene();
  
  // 家具群組
  scene.add(furnitureGroup);
  furnitureGroup.visible = false;
  buildFurniture();

  // 事件監聽
  window.addEventListener('resize', onResize);
  document.addEventListener('keydown', onKeyPress);

  // 開始渲染
  animate();
  
  console.log('✅ 3D 場景初始化完成');
}

// =============================================
// 建立房間
// =============================================
function buildScene() {
  SPACES.forEach((space, index) => {
    const group = new THREE.Group();
    const [x, y, z] = space.pos;
    const [w, h, d] = space.size;

    group.position.set(x, y, z);

    // 地板
    const floorGeo = new THREE.BoxGeometry(w, 0.1, d);
    const floorMat = new THREE.MeshStandardMaterial({ color: space.color, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.receiveShadow = true;
    floor.userData = { type: 'floor', spaceId: space.id, spaceName: space.name };
    group.add(floor);

    // 牆壁
    const wallMat = new THREE.MeshStandardMaterial({ 
      color: 0xf5f5dc, 
      roughness: 0.9,
      side: THREE.DoubleSide 
    });

    const walls = [
      new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat.clone()),
      new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat.clone()),
      new THREE.Mesh(new THREE.PlaneGeometry(d, h), wallMat.clone()),
      new THREE.Mesh(new THREE.PlaneGeometry(d, h), wallMat.clone())
    ];

    walls[0].position.set(0, h/2, -d/2);
    walls[1].position.set(0, h/2, d/2);
    walls[1].rotation.y = Math.PI;
    walls[2].position.set(-w/2, h/2, 0);
    walls[2].rotation.y = Math.PI / 2;
    walls[3].position.set(w/2, h/2, 0);
    walls[3].rotation.y = -Math.PI / 2;

    walls.forEach(wall => {
      wall.castShadow = true;
      wall.receiveShadow = true;
      group.add(wall);
    });

    // 房間編號標籤
    const labelGeo = new THREE.SphereGeometry(0.3);
    const labelMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
    const label = new THREE.Mesh(labelGeo, labelMat);
    label.position.y = h + 0.5;
    group.add(label);

    scene.add(group);
    roomMeshes.push({ space, group, floor });
  });

  console.log(`✅ 已建立 ${SPACES.length} 個房間`);
}

// =============================================
// 建立家具
// =============================================
function buildFurniture() {
  FURNITURE.forEach(item => {
    const [w, h, d] = item.size;
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color: item.color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...item.pos);
    mesh.castShadow = true;
    mesh.userData = { name: item.name, type: 'furniture' };
    furnitureGroup.add(mesh);
  });

  console.log(`✅ 已建立 ${FURNITURE.length} 件未來家具`);
}

// =============================================
// 渲染迴圈
// =============================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// =============================================
// 事件處理
// =============================================
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onKeyPress(e) {
  const key = e.key;
  if (key >= '1' && key <= '9') {
    const index = parseInt(key) - 1;
    if (index < SPACES.length) {
      focusOnRoom(index);
    }
  }
}

function focusOnRoom(index) {
  const space = SPACES[index];
  const [x, y, z] = space.pos;
  
  controls.target.set(x, y + 1.5, z);
  camera.position.set(x + 15, y + 10, z + 15);
  
  document.getElementById('room-name').textContent = space.name;
  document.getElementById('room-desc').textContent = space.desc;
}

// =============================================
// 全域函數
// =============================================
window.setMode = function(mode) {
  currentMode = mode;
  furnitureGroup.visible = (mode === 'future');
  
  const btns = document.querySelectorAll('.mode-btn');
  btns.forEach(btn => btn.classList.remove('active'));
  
  if (mode === 'current') {
    btns[0].classList.add('active');
    document.getElementById('mode-badge').className = 'current';
    document.getElementById('mode-badge').textContent = '🏛️ 現況場景';
  } else {
    btns[1].classList.add('active');
    document.getElementById('mode-badge').className = 'future';
    document.getElementById('mode-badge').textContent = '✨ 未來改造';
  }
};

window.startExplore = function() {
  document.getElementById('start-hint').classList.add('hidden');
  focusOnRoom(0);
};

// 啟動
init();
</script>

</body>
</html>
