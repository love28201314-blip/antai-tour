<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <style>
    * {

    }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;

    }

    #info-panel {
      position: fixed;

      font-weight: 700;
      margin-bottom: 12px;
    }

    #mode-badge.current {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    #mode-badge.future {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    #room-title {
      font-size: 24px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 8px;
    }

    #room-desc {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.92);
      color: white;
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(15px);
      z-index: 100;
      font-size: 13px;
      line-height: 1.9;
    }

    .key {
      display: inline-block;
      background: rgba(102, 126, 234, 0.3);
      padding: 2px 9px;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      border: 1px solid rgba(102, 126, 234, 0.5);
    }

    #mode-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-btn {
      padding: 14px 28px;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(15px);
      text-align: left;
    }

    .mode-btn:hover {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: #fbbf24;
      transform: translateX(-8px);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
    }

    #room-navigator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 18px;
      backdrop-filter: blur(15px);
      z-index: 100;
      max-width: 280px;
      max-height: 70vh;
      overflow-y: auto;
    }

    #navigator-title {
      color: #fbbf24;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 15px;
      text-align: center;
      border-bottom: 2px solid rgba(251, 191, 36, 0.3);
      padding-bottom: 10px;
    }

    .room-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      font-weight: 600;
    }

    .room-item:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      transform: translateX(5px);
    }

    .room-item.active {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.35) 0%, rgba(118, 75, 162, 0.35) 100%);
      color: #fbbf24;
      border: 2px solid rgba(251, 191, 36, 0.5);
    }

    .room-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }

    .room-item.active .room-dot {
      background: #fbbf24;
      box-shadow: 0 0 15px #fbbf24;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1e1e2e 0%, #0a0a0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 75px;
      height: 75px;
      border: 6px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      color: white;
      margin-top: 22px;
      font-size: 21px;
      font-weight: 700;
    }

    #loading-progress {
      color: #10b981;
      margin-top: 12px;
      font-size: 15px;
    }

    @media (max-width: 768px) {
      #info-panel { max-width: 300px; font-size: 12px; }
      #room-navigator { max-width: 240px; }
      #controls { font-size: 11px; }
    }
  </style>

function init() {
  // 場景
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 0, 100);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(18, 12, 18);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
  sunLight.position.set(30, 40, 30);
  sunLight.castShadow = true;
  sunLight.shadow.camera.left = -60;
  sunLight.shadow.camera.right = 60;
  sunLight.shadow.camera.top = 60;
  sunLight.shadow.camera.bottom = -60;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  scene.add(sunLight);

  // 軌道控制

  controls.dampingFactor = 0.06;

  controls.maxDistance = 80;
  controls.maxPolarAngle = Math.PI / 2;

  // 建立場景

  scene.add(furnitureGroup);

  animate();
}

// =============================================
// 建立真實空間（使用照片紋理）
// =============================================
function buildRealSpaces() {
  const textureLoader = new THREE.TextureLoader();

  ROOMS.forEach((room) => {
    textureLoader.load(
      room.image,
      (texture) => {
        createRoom(room, texture);
        loadedImages++;
        updateLoadingProgress();
      },
      undefined,
      (error) => {
        console.warn(`載入 ${room.image} 失敗，使用預設材質`);
        createRoom(room, null);
        loadedImages++;
        updateLoadingProgress();
      }
    );
  });
}

function updateLoadingProgress() {
  document.getElementById('loading-progress').textContent = 
    `載入照片 ${loadedImages}/10`;

  if (loadedImages === 10) {
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      focusRoom(1);
    }, 600);
  }
}

function createRoom(roomData, texture) {
  const group = new THREE.Group();
  const [x, y, z] = roomData.position;
  const [w, h, d] = roomData.size;

  group.position.set(x, y, z);
  group.userData = { roomId: roomData.id, roomName: roomData.name, roomDesc: roomData.desc };

  // 地板
  const floorGeo = new THREE.BoxGeometry(w, 0.15, d);
  const floorMat = new THREE.MeshStandardMaterial({ 
    color: 0x8b8680,
    roughness: 0.7
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.receiveShadow = true;
  floor.userData = { type: 'floor', roomId: roomData.id };
  group.add(floor);

  // 牆壁材質
  const wallMat = texture 
    ? new THREE.MeshStandardMaterial({ 
        map: texture,
        side: THREE.DoubleSide 
      })
    : new THREE.MeshStandardMaterial({ 
        color: 0xf5f5dc,
        side: THREE.DoubleSide 
      });

  // 四面牆
  const walls = [
    { geo: new THREE.PlaneGeometry(w, h), pos: [0, h/2, -d/2], rot: [0, 0, 0] },
    { geo: new THREE.PlaneGeometry(w, h), pos: [0, h/2, d/2], rot: [0, Math.PI, 0] },
    { geo: new THREE.PlaneGeometry(d, h), pos: [-w/2, h/2, 0], rot: [0, Math.PI/2, 0] },
    { geo: new THREE.PlaneGeometry(d, h), pos: [w/2, h/2, 0], rot: [0, -Math.PI/2, 0] }
  ];

  walls.forEach(wallData => {
    const wall = new THREE.Mesh(wallData.geo, wallMat.clone());
    wall.position.set(...wallData.pos);
    wall.rotation.set(...wallData.rot);
    wall.castShadow = true;
    wall.receiveShadow = true;
    group.add(wall);
  });

  // 天花板
  const ceiling = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({ color: 0xe0e0e0, side: THREE.DoubleSide })
  );
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = h;
  ceiling.receiveShadow = true;
  group.add(ceiling);

  // 房間標籤
  const label = createLabel(roomData.name, roomData.floor);
  label.position.y = h + 1;
  group.add(label);

  scene.add(group);
  roomGroups.push({ data: roomData, group });
}

function createLabel(name, floor) {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  canvas.width = 512;
  canvas.height = 150;

  context.fillStyle = 'rgba(0, 0, 0, 0.85)';
  context.fillRect(0, 0, canvas.width, canvas.height);

  context.font = 'bold 48px Arial';
  context.fillStyle = '#fbbf24';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(name, canvas.width / 2, canvas.height / 2 - 15);

  context.font = '32px Arial';
  context.fillStyle = '#10b981';
  context.fillText(floor, canvas.width / 2, canvas.height / 2 + 30);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(5, 1.5, 1);

  return sprite;
}
